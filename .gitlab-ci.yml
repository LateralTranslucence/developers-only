image: wordpress:latest

stages:
- deploy

variables:
  THEME_NAME: 'developers-only'

dev_deploy:
  only:
    - dev
  variables:
    ENVIRONMENT_NAME: 'devdevsonly'
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
  script:
    # Connect to server and create _tmp_$THEME_NAME if it doesn't exist, create $THEME_NAME if it doesn't exist, create _old_$THEME_NAME if it doesn't exist
    - ssh -tt -oStrictHostKeyChecking=no $ENVIRONMENT_NAME@$ENVIRONMENT_NAME.ssh.wpengine.net "cd ~/sites/$ENVIRONMENT_NAME/wp-content/themes && mkdir -p _tmp_$THEME_NAME && mkdir -p $THEME_NAME && mkdir -p _old_$THEME_NAME"
    # Copy files from repository to remote _tmp folder
    - rsync -avu --stats --exclude=.* $CI_PROJECT_DIR/ $ENVIRONMENT_NAME@$ENVIRONMENT_NAME.ssh.wpengine.net:~/sites/$ENVIRONMENT_NAME/wp-content/themes/_tmp_$THEME_NAME
    # Connect to server and replace DEPLOY_TIMESTAMP with timestamp
    - ssh -oStrictHostKeyChecking=no -tt $ENVIRONMENT_NAME@$ENVIRONMENT_NAME.ssh.wpengine.net "cd ~/sites/$ENVIRONMENT_NAME/wp-content/themes/_tmp_$THEME_NAME && sed -i -e \"s/DEPLOY_TIMESTAMP/$(date +%s)/g\" functions.php"
    # Connect to server and move files from $THEME_NAME to _old_$THEME_NAME, move files from _tmp_$THEME_NAME to $THEME_NAME
    - ssh -oStrictHostKeyChecking=no -tt $ENVIRONMENT_NAME@$ENVIRONMENT_NAME.ssh.wpengine.net "mv ~/sites/$ENVIRONMENT_NAME/wp-content/themes/$THEME_NAME/* ~/sites/$ENVIRONMENT_NAME/wp-content/themes/_old_$THEME_NAME && mv ~/sites/$ENVIRONMENT_NAME/wp-content/themes/_tmp_$THEME_NAME/* ~/sites/$ENVIRONMENT_NAME/wp-content/themes/$THEME_NAME"
    # Connect to server and delete _old_$THEME_NAME, delete _tmp_$THEME_NAME
    - ssh -oStrictHostKeyChecking=no -tt $ENVIRONMENT_NAME@$ENVIRONMENT_NAME.ssh.wpengine.net "cd ~/sites/$ENVIRONMENT_NAME/wp-content/themes && rm -rf _old_$THEME_NAME && rm -rf _tmp_$THEME_NAME"
  when: on_success
  stage: deploy
  tags:
    - ci
  environment:
    name: Development
    url: https://dev.developersonly.work/
  allow_failure: false

